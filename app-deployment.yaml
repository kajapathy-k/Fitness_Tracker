apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-app
  namespace: gateway-ns
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: fitness-tracker-app

  template:
    metadata:
      labels:
        app: fitness-tracker-app
      annotations:
        ad.datadoghq.com/fitness-tracker-app.logs: >-
          [{"source":"nodejs","service":"fitness-tracker-service"},
           {"source":"nodejs","service":"fitness-tracker-app"}]

    spec:
      containers:
        - name: fitness-tracker-app
          image: pulkit197/fitness_tracker-master-copy3-fitness-app:latest

          ports:
            - containerPort: 5000

          # 🔥 OOM Simulation Script
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Starting OOM simulation...";
              i=0;
              while true; do
                i=$((i+1));
                echo "Allocating chunk $i";
                a="$a $(head -c 1M </dev/zero | tr '\0' 'a')";
                sleep 0.1;
              done

          # 🔥 Reduced Memory (to trigger OOM quickly)
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"

          envFrom:
            - configMapRef:
                name: fitness-tracker-config
            - secretRef:
                name: fitness-tracker-secret

          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

---
apiVersion: v1
kind: Service
metadata:
  name: fitness-tracker-service
  namespace: gateway-ns
spec:
  selector:
    app: fitness-tracker-app
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP